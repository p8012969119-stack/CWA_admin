[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["echo 'No dependencies required'"]

[phases.build]
cmds = ["node --check server.mjs && node --check scripts/write-runtime-config.mjs && node --check public/app.js"]

[start]
cmd = "node scripts/write-runtime-config.mjs && node server.mjs"

[variables]
NODE_ENV = "production"
ADMIN_API_BASE_URL = "https://api.crackwithai.net/api"
